name: Deploy to ycechungAI.github.io/web322

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout ycechungAI.github.io
        uses: actions/checkout@v4
        with:
          repository: ycechungAI/ycechungAI.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: target

      - name: Copy static site into web322/
        run: |
          rm -rf target/web322
          mkdir -p target/web322
          cp src/index.html src/imagelist.txt target/web322/
          cp -r src/public target/web322/

      - name: Commit and push to ycechungAI.github.io
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web322
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "Deploy web322 from eugene-chung-a1web322gallery@${GITHUB_SHA::7}"
          git push
